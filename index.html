<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Guidance Generator</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
    <h1>
        Career Guidance Generator
    </h1>
    <h2>
    💼 Tell me your career goals:
    </h2>
    <form>
        <div
        id="search-results">
        <input
        type="text"
        placeholder="Enter Your Career Goals"
        required />
        <input type="submit" value="Generate Advice" />
        <p> i.e. I want to be a Software Developer </p>
        </div>
    </form>
    <div
        id="career-results"></div>

        This project was coded by

        </a>
        🤎 and is open-sourced on
        <a href="https://github.com/tebomabusetsa-ops/weather-app-by-tebogo" target="_blank">
            GitHub
        </a>
        and hosted on
        <a href="https://weather-app-by-tebogo.netlify.app/" target="_blank">
            Netlify
        </a>
    </footer>
    </div>
</body>
</html>
