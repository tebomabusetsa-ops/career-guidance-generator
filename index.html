<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Guidance Generator</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
    <h1>
        Career Guidance Generator
    </h1>
    <h2>
    💼 Tell me your career goals:
    </h2>
    
    <form id="career-form">
        <div
        id="search-results">
        <input
        type="text"
        id="career-input"
        placeholder="Enter Your Career Goals"
        required />
        <input type="submit" value="Generate Advice" />
        <p> i.e. I want to be a Software Developer </p>
        </div>
    </form>
    <div
        id="career-results"></div>
    <footer> 
        This project was coded by
        <a href="https://github.com/tebomabusetsa-ops" target="_blank">
            Tebogo Mabusetsa
        </a>
        🤎 and is open-sourced on
        <a href="https://github.com/tebomabusetsa-ops/career-guidance-generator">
            GitHub
        </a>
        and hosted on
        <a href="https://career-guidance-generator.netlify.app/">
            Netlify
        </a>
    </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="index.js"></script>
</body>
</html>H
